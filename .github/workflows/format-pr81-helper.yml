name: Temporary format PR 81

on:
  push:
    branches:
      - renovate/prettier-plugin-astro-1.x

permissions:
  contents: read

jobs:
  format:
    name: Generate formatter patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run formatter and print patch
        run: |
          pnpm format
          git diff -- . ':(exclude).github/workflows/format-pr81-helper.yml' > /tmp/format.patch
          echo '---FORMAT-PATCH-BEGIN---'
          cat /tmp/format.patch
          echo '---FORMAT-PATCH-END---'
