<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">Idle</title>
  <desc id="desc">A softly glowing amber crescent.</desc>
  <defs>
    <linearGradient id="idle-moon" x1="8" y1="7" x2="24" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff1ad" />
      <stop offset="0.42" stop-color="#ffc857" />
      <stop offset="1" stop-color="#e78a19" />
    </linearGradient>
    <filter id="idle-bloom" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.45" />
    </filter>
    <mask id="idle-crescent">
      <rect width="32" height="32" fill="#000" />
      <circle cx="15.4" cy="16.1" r="11.3" fill="#fff" />
      <circle cx="11.15" cy="11.15" r="10.15" fill="#000" />
    </mask>
  </defs>
  <g filter="url(#idle-bloom)" opacity="0.34">
    <circle cx="15.4" cy="16.1" r="11.7" fill="#ffc857" mask="url(#idle-crescent)" />
  </g>
  <circle cx="15.4" cy="16.1" r="11.3" fill="url(#idle-moon)" mask="url(#idle-crescent)" />
</svg>
