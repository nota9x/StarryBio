name: Temporary Astro upgrade

on:
  push:
    branches:
      - chore/astro-7.3-upgrade

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Upgrade Astro
        run: yes | pnpm dlx @astrojs/upgrade

      - name: Validate upgraded project
        run: |
          pnpm check
          pnpm build

      - name: Commit upgrade
        run: |
          rm .github/workflows/temporary-astro-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/temporary-astro-upgrade.yml
          if git diff --cached --quiet; then
            echo "No dependency changes produced."
            exit 0
          fi
          git commit -m "chore(deps): upgrade Astro"
          git push
