<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">Offline</title>
  <desc id="desc">A subdued blue-gray presence halo.</desc>
  <defs>
    <linearGradient id="offline-ring" x1="8" y1="7" x2="24" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c7d2e5" />
      <stop offset="0.45" stop-color="#8491aa" />
      <stop offset="1" stop-color="#525d73" />
    </linearGradient>
    <filter id="offline-bloom" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.3" />
    </filter>
    <mask id="offline-halo">
      <rect width="32" height="32" fill="#000" />
      <circle cx="16" cy="16" r="11.25" fill="#fff" />
      <circle cx="16" cy="16" r="6.45" fill="#000" />
    </mask>
  </defs>
  <g filter="url(#offline-bloom)" opacity="0.25">
    <circle cx="16" cy="16" r="11.7" fill="#91a0bc" mask="url(#offline-halo)" />
  </g>
  <circle cx="16" cy="16" r="11.25" fill="url(#offline-ring)" mask="url(#offline-halo)" />
</svg>
