name: Theme or layout proposal
description: Suggest a new visual preset, layout mode, or improvement to an existing one.
title: '[DESIGN] '
labels:
  - 'feature'
  - 'needs triage'
assignees:
  - nota9x
body:
  - type: markdown
    attributes:
      value: |
        StarryBio themes are cohesive presets, not accent-only variations. Proposals should work across narrow and wide screens and retain readable contrast and reduced-motion support.
  - type: dropdown
    id: proposal-type
    attributes:
      label: Proposal type
      options:
        - Theme preset
        - Layout mode
        - Improvement to an existing theme or layout
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and benefit
      description: Describe the visual direction or behavior, who it helps, and why existing themes or layouts do not cover it.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References or mockups
      description: Attach sketches, screenshots, or inspiration links. Do not submit copyrighted assets for direct reuse.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and presets before submitting.
          required: true
