name: Bug report
description: Report a reproducible problem with StarryBio's site, configuration, build, or deployment.
title: '[BUG] '
labels:
  - 'bug'
  - 'needs triage'
assignees:
  - nota9x
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities publicly. Use [private vulnerability reporting](https://github.com/nota9x/StarryBio/security/advisories/new) instead. Remove credentials, analytics tokens, and personal data from this report.
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
      placeholder: On a narrow viewport, the profile card overlaps the first link. It should remain readable and separate from the link.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the project with `pnpm dev`
        2. Open ...
        3. Change ...
        4. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Configuration or validation
        - Build or generated asset
        - Rendered site or browser behavior
        - Deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the relevant OS, browser and viewport, Node.js, pnpm, hosting provider, and StarryBio version or commit.
      placeholder: 'Windows 11; Chrome 140 at 390px; Node 24.15.0; pnpm 12.3.4; GitHub Pages; v3.6.0'
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or configuration excerpt
      description: Attach a screenshot or paste the smallest redacted log or configuration excerpt that shows the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets, analytics tokens, and personal information.
          required: true
