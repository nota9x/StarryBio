name: Analytics provider proposal
description: Propose support for an additional analytics provider or an improvement to an existing integration.
title: '[ANALYTICS] '
labels:
  - 'feature'
  - 'area: analytics'
  - 'needs triage'
assignees:
  - nota9x
body:
  - type: markdown
    attributes:
      value: |
        StarryBio supports Google Analytics, Cloudflare Web Analytics, Plausible, Umami, and custom HTTPS scripts. Do not include real site IDs, tokens, credentials, or account data.
  - type: input
    id: provider
    attributes:
      label: Provider name
      placeholder: "e.g. Bob's Analytics"
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Explain why the existing providers or custom-script option do not meet this need.
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Proposed integration
      description: Link official documentation. Describe the placeholder-only configuration fields, external HTTPS script URL, required data attributes, and script or network origins for Content Security Policy.
      placeholder: |
        Official docs: https://example.com/docs
        Suggested config: `{ provider: 'example', siteId: 'YOUR_SITE_ID' }`
        Script: https://example.com/script.js
        Attributes and origins: data-site-id; https://example.com
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reviewed the existing analytics providers and custom-script option.
          required: true
        - label: I have not included real credentials, tokens, or personal analytics data.
          required: true
