name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to rebuild and finalize
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    name: Create or update draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    name: Build, attest, and publish immutable release
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(node -p "'v' + require('./package.json').version")" = "${RELEASE_TAG}"
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = "true"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve preceding stable release
        id: previous
        shell: bash
        run: |
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq ".[] | select(.tagName != \"${RELEASE_TAG}\") | .tagName" | head -n 1)"
          echo "tag=${previous}" >> "${GITHUB_OUTPUT}"

      - name: Build deterministic update payload
        shell: bash
        run: |
          args=(--tag "${RELEASE_TAG}" --commit "${GITHUB_SHA}" --output release-artifacts)
          if test -n "${{ steps.previous.outputs.tag }}"; then
            args+=(--previous-tag "${{ steps.previous.outputs.tag }}")
          fi
          pnpm exec tsx scripts/create-update-artifact.ts "${args[@]}"
          pnpm exec tsx scripts/verify-update-artifact.ts "release-artifacts/starrybio-update-${RELEASE_TAG}.tgz"

      - name: Generate SLSA provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/starrybio-update-${{ env.RELEASE_TAG }}.tgz

      - name: Attach payload and provenance bundle to draft
        shell: bash
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" release-artifacts/slsa-provenance.sigstore.json
          gh release upload "${RELEASE_TAG}" \
            "release-artifacts/starrybio-update-${RELEASE_TAG}.tgz" \
            release-artifacts/slsa-provenance.sigstore.json --clobber

      - name: Publish and lock release
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest

      - name: Independently verify immutable release
        shell: bash
        run: |
          for attempt in {1..6}; do
            if gh release verify "${RELEASE_TAG}" && \
              gh release verify-asset "${RELEASE_TAG}" "release-artifacts/starrybio-update-${RELEASE_TAG}.tgz" && \
              gh release verify-asset "${RELEASE_TAG}" release-artifacts/slsa-provenance.sigstore.json; then
              exit 0
            fi
            sleep 10
          done
          exit 1
